kind = "web"
previewPath = "/"
title = "Општина"
version = "1.0.0"
id = "artifacts/municipality"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23860

[services.development]
run = "pnpm --filter @workspace/municipality run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/municipality", "run", "build" ]
publicDir = "artifacts/municipality/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23860"
BASE_PATH = "/"
